spring:
  servlet:
    multipart:
      # Spring's defaults (1MB file / 1MB request) reject a real phone camera photo outright —
      # even a compressed JPEG from a modern camera routinely runs several MB. Chat image
      # messages go through /chat/images as multipart (ChatController), so this is the ceiling
      # for that upload.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:15MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:15MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kollekt}
    username: ${SPRING_DATASOURCE_USERNAME:kollekt}
    password: ${SPRING_DATASOURCE_PASSWORD:kollekt}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${DB_KEEPALIVE_MS:120000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain,text/css,application/javascript

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    # Provider: Resend SMTP (host smtp.resend.com, username "resend", password = API key).
    # Disabled by default so local/dev and tests log instead of sending. Set APP_MAIL_ENABLED=true
    # with a verified sender once SMTP credentials are configured.
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:Kollekt <no-reply@kollekt.no>}
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    token-validity-seconds: ${APP_SECURITY_TOKEN_VALIDITY_SECONDS:3600}
    # One year. Refresh tokens are single-use and re-issued with a full window on every use, so
    # this is an idle timeout, not a session cap: it only signs out someone who has not opened
    # the app in that long. Two weeks meant a fortnight away from the app looked like a bug.
    refresh-token-validity-seconds: ${APP_SECURITY_REFRESH_TOKEN_VALIDITY_SECONDS:31536000}
    # Max unauthenticated sign-in attempts per IP per minute. Token refresh is deliberately
    # exempt (see AuthRateLimitFilter) — it is an authenticated client keeping a live session,
    # and throttling it reads to the user as being logged out.
    auth-rate-limit-per-minute: ${APP_SECURITY_AUTH_RATE_LIMIT_PER_MINUTE:10}
  version:
    # This must track what's actually LIVE on the App Store, not the Xcode project's
    # MARKETING_VERSION — a build can sit in review for days ahead of that. Bump
    # APP_VERSION_LATEST_IOS (no code deploy needed) only once Apple approves a new version and
    # it's live, to trigger the "update available" overlay on older installs. Bumping it early
    # (while the new build is still in review) would send users to an App Store page that
    # doesn't have it yet.
    latest-ios: ${APP_VERSION_LATEST_IOS:1.0}
    ios-store-url: ${APP_VERSION_IOS_STORE_URL:https://apps.apple.com/no/app/kollekt/id6788522377?l=nb}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google-calendar/callback}
    frontend-url: ${GOOGLE_FRONTEND_URL:http://localhost:5173}
    mobile-return-url: ${GOOGLE_MOBILE_RETURN_URL:no.kollekt.app://google-calendar-connected}
  social:
    google-client-ids: ${SOCIAL_GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}
    apple-client-ids: ${SOCIAL_APPLE_CLIENT_IDS:}
  apns:
    team-id: ${APNS_TEAM_ID:}
    key-id: ${APNS_KEY_ID:}
    # Base64-encoded contents of the APNs .p8 auth key. Base64 avoids the PEM newlines/whitespace
    # getting mangled by whatever env-var pipeline sits between the host and the container.
    auth-key-base64: ${APNS_AUTH_KEY_BASE64:}
    bundle-id: ${APNS_BUNDLE_ID:no.kollekt.app}
    production: ${APNS_PRODUCTION:false}
  fcm:
    # Base64-encoded contents of the Firebase service-account JSON (Firebase Console > Project
    # settings > Service accounts > Generate new private key). Same base64 convention as
    # APNS_AUTH_KEY_BASE64, for the same env-var-pipeline-safety reason.
    credentials-base64: ${FCM_CREDENTIALS_BASE64:}
  moderation:
    # Every image upload (chat images, task feedback/completion photos) is checked against Google
    # Cloud Vision SafeSearch before it's stored. Once a key is set this fails CLOSED — a Vision
    # outage rejects the upload rather than assuming it's safe. A BLANK GOOGLE_CLOUD_VISION_API_KEY
    # means moderation was never configured on this deployment, and uploads are then accepted
    # unchecked (loudly warned at startup and per upload) so an un-keyed environment isn't an app
    # with permanently broken photo upload. Always set the key in production.
    # APP_MODERATION_ENABLED=false turns the gate off entirely — local development only.
    enabled: ${APP_MODERATION_ENABLED:true}
    google-vision-api-key: ${GOOGLE_CLOUD_VISION_API_KEY:}
    # Vision API's free tier is 1,000 SafeSearch calls/month; Google's own quota UI can't enforce
    # a precise monthly cap (only per-minute), so we track calls ourselves. Once the limit is hit
    # for the current calendar month, moderation is skipped (fails OPEN, unlike the checks above)
    # so uploads keep working rather than being blocked for the rest of the month — a deliberate
    # trade-off accepted in exchange for never being billed beyond the free tier.
    monthly-call-limit: ${APP_MODERATION_MONTHLY_CALL_LIMIT:1000}
