[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
    "src/**",
    "build.gradle.kts",
    "settings.gradle.kts",
    "gradle/**",
    "gradlew",
    "Dockerfile",
    "railway.toml",
]

[deploy]
region = "europe-west4-drams3a"
numReplicas = 1
healthcheckPath = "/api/health"
healthcheckTimeout = 180
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 10
drainingSeconds = 15
