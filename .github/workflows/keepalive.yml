# Keeps the free-tier Render backend warm so login (the first request after idle) is fast.
# Render free instances sleep after ~15 min idle and then cold-start slowly (30s-2min).
# Pinging /api/health every ~10 min prevents that idle window from being reached.
#
# Notes:
# - GitHub disables scheduled workflows after 60 days with no repo activity; a commit re-enables it.
# - Scheduled runs can be delayed under load, so the interval is comfortably under 15 min.
# - Run manually any time via the "Run workflow" button (workflow_dispatch).
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
              https://kollekt-backend.onrender.com/api/health || echo "000")
            echo "Attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not respond OK after retries (it may still be cold-starting)."
          # Don't fail the workflow — a missed ping shouldn't spam failure emails.
          exit 0
